<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · cf-cron-panel</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1f2329; --muted:#6b7280; --line:#e5e7eb; --primary:#2563eb; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1a1f26; --text:#e6e8eb; --muted:#9aa3af; --line:#2b323b; --primary:#60a5fa; --bad:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  form { width:min(360px, 92vw); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:24px; display:grid; gap:12px; }
  h1 { margin:0 0 4px; font-size:18px; }
  input { font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); width:100%; }
  button { font:inherit; padding:9px 12px; border-radius:6px; border:0; background:var(--primary); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .msg { min-height:20px; color:var(--bad); font-size:13px; }
  .msg.info { color:var(--muted); }
</style>
</head>
<body>
<form id="form">
  <h1>cf-cron-panel</h1>
  <input id="pw" type="password" placeholder="管理员密码" autocomplete="current-password" autofocus required>
  <button id="btn" type="submit">登录</button>
  <div class="msg" id="msg"></div>
</form>
<script>
const form = document.getElementById("form"), pw = document.getElementById("pw"), btn = document.getElementById("btn"), msg = document.getElementById("msg");

fetch("/api/session").then((r) => r.json()).then((s) => {
  if (s.authenticated) location.replace("/");
  else if (!s.configured) { msg.className = "msg"; msg.textContent = "服务端未配置 ADMIN_PASSWORD，面板已禁用。"; btn.disabled = true; }
}).catch(() => {});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  btn.disabled = true; msg.className = "msg info"; msg.textContent = "登录中…";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Requested-With": "dashboard" },
      body: JSON.stringify({ password: pw.value }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) { location.replace("/"); return; }
    msg.className = "msg"; msg.textContent = data.error || `登录失败（HTTP ${res.status}）`;
  } catch (err) {
    msg.className = "msg"; msg.textContent = "网络错误：" + err.message;
  }
  btn.disabled = false; pw.select();
});
</script>
</body>
</html>
