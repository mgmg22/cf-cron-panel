<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cf-cron-panel</title>
<style>
  :root {
    --bg:#f0f2f5; --card:#fff; --text:#1f2329; --muted:#6b7280; --line:#eceef1; --hover:#f7f8fa;
    --primary:#1668dc; --primary-bg:#e8f1ff; --ok:#389e0d; --ok-bg:#f1fae6; --warn:#d46b08; --warn-bg:#fff7e6;
    --bad:#cf1322; --bad-bg:#fff1f0; --gray-bg:#f3f4f6; --code:#f6f7f9; --sider:#fff; --shadow:0 1px 2px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --bg:#0f1216; --card:#181c22; --text:#e6e8eb; --muted:#9aa3af; --line:#272d36; --hover:#1e242c;
      --primary:#5b9dff; --primary-bg:#14263f; --ok:#6fcf3a; --ok-bg:#1a2a12; --warn:#f0a040; --warn-bg:#2f2210;
      --bad:#ff7875; --bad-bg:#2f1517; --gray-bg:#232830; --code:#12161b; --sider:#14181d; --shadow:none;
    }
  }
  :root[data-theme=dark] {
    --bg:#0f1216; --card:#181c22; --text:#e6e8eb; --muted:#9aa3af; --line:#272d36; --hover:#1e242c;
    --primary:#5b9dff; --primary-bg:#14263f; --ok:#6fcf3a; --ok-bg:#1a2a12; --warn:#f0a040; --warn-bg:#2f2210;
    --bad:#ff7875; --bad-bg:#2f1517; --gray-bg:#232830; --code:#12161b; --sider:#14181d; --shadow:none;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  [hidden] { display:none !important; }
  button { font:inherit; color:inherit; cursor:pointer; }
  svg { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* 布局：左侧菜单 + 右侧内容 */
  .layout { display:flex; min-height:100vh; }
  .sider { width:208px; flex:none; background:var(--sider); border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .brand { padding:18px 20px; font-size:17px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .brand i { width:8px; height:8px; border-radius:50%; background:var(--primary); }
  nav { padding:4px 10px; display:grid; gap:2px; }
  nav a { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:var(--text); text-decoration:none; }
  nav a:hover { background:var(--hover); }
  nav a.active { background:var(--primary-bg); color:var(--primary); font-weight:500; }
  .sider-foot { margin-top:auto; padding:10px; border-top:1px solid var(--line); display:grid; gap:2px; }
  .sider-foot button { display:flex; align-items:center; gap:10px; width:100%; padding:8px 12px; border:0; border-radius:8px; background:none; text-align:left; color:var(--muted); }
  .sider-foot button:hover { background:var(--hover); color:var(--text); }
  .main { flex:1; min-width:0; }
  .topbar { height:56px; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; padding:0 20px; position:sticky; top:0; z-index:5; }
  .topbar h1 { margin:0; font-size:16px; font-weight:600; }
  .spacer { flex:1; }
  .content { padding:16px 20px 32px; display:grid; gap:14px; max-width:1280px; }
  .btn.menu-btn { display:none; }
  .mask { display:none; }

  /* 通用组件 */
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
  .btn:hover { border-color:var(--primary); color:var(--primary); }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
  .btn.primary:hover { opacity:.9; color:#fff; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.icon { padding:5px 8px; }
  .link { background:none; border:0; padding:0; color:var(--primary); }
  .link:hover { opacity:.75; }
  .link:disabled { color:var(--muted); cursor:not-allowed; opacity:1; }
  .tag { display:inline-flex; align-items:center; gap:4px; padding:0 8px; border-radius:6px; font-size:12px; line-height:22px; white-space:nowrap; background:var(--gray-bg); color:var(--muted); }
  .tag.ok { background:var(--ok-bg); color:var(--ok); } .tag.warn { background:var(--warn-bg); color:var(--warn); }
  .tag.bad { background:var(--bad-bg); color:var(--bad); } .tag.run { background:var(--primary-bg); color:var(--primary); }
  svg.spin { animation:spin 1s linear infinite; } @keyframes spin { to { transform:rotate(360deg); } }
  .banner { padding:10px 14px; border-radius:8px; background:var(--warn-bg); color:var(--warn); border:1px solid transparent; }
  .banner a { color:inherit; font-weight:500; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  code, pre { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  code { background:var(--code); padding:1px 6px; border-radius:4px; font-size:13px; }

  /* 表格（窄屏自动变成卡片列表） */
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-weight:500; color:var(--muted); background:var(--hover); padding:11px 16px; white-space:nowrap; }
  /* 卡片不能设 overflow:hidden（会截断「更多」弹出层），表格圆角由首尾单元格自己处理 */
  thead th:first-child { border-top-left-radius:10px; } thead th:last-child { border-top-right-radius:10px; }
  tbody tr:last-child td:first-child { border-bottom-left-radius:10px; } tbody tr:last-child td:last-child { border-bottom-right-radius:10px; }
  td { padding:14px 16px; border-top:1px solid var(--line); vertical-align:middle; }
  tbody tr:hover { background:var(--hover); }
  .name { font-weight:500; } .desc { color:var(--muted); font-size:12px; margin-top:2px; max-width:300px; }
  .cron-cell { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .actions { display:flex; align-items:center; gap:14px; white-space:nowrap; }
  details.more { position:relative; }
  details.more summary { list-style:none; color:var(--primary); cursor:pointer; }
  details.more summary::-webkit-details-marker { display:none; }
  details.more .pop { position:absolute; right:0; top:26px; z-index:10; min-width:132px; background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.14); padding:4px; display:grid; }
  details.more .pop button { background:none; border:0; text-align:left; padding:7px 12px; border-radius:6px; }
  details.more .pop button:hover { background:var(--hover); }
  details.more .pop button:disabled { color:var(--muted); cursor:not-allowed; }

  /* 对话框 / 抽屉 / 提示 */
  dialog { border:1px solid var(--line); border-radius:12px; padding:0; background:var(--card); color:var(--text); box-shadow:0 12px 40px rgba(0,0,0,.25); max-width:calc(100vw - 24px); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dlg { width:460px; max-width:100%; }
  .dlg-h { padding:14px 20px; border-bottom:1px solid var(--line); font-weight:600; display:flex; align-items:center; gap:8px; }
  .dlg-b { padding:16px 20px; display:grid; gap:10px; }
  .dlg-f { padding:12px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
  dialog.drawer { margin:0 0 0 auto; height:100vh; max-height:100vh; width:560px; border-radius:0; border-width:0 0 0 1px; }
  dialog.drawer .dlg { width:100%; height:100%; display:flex; flex-direction:column; }
  dialog.drawer .dlg-b { flex:1; overflow:auto; align-content:start; }
  input[type=text] { font:13px ui-monospace,Menlo,Consolas,monospace; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); width:100%; }
  input[type=text]:focus { outline:2px solid var(--primary-bg); border-color:var(--primary); }
  .kv { display:grid; grid-template-columns:84px 1fr; gap:4px 10px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; }
  pre { background:var(--code); border-radius:8px; padding:12px; margin:0; white-space:pre-wrap; word-break:break-word; font-size:12px; line-height:1.6; }
  #toasts { position:fixed; top:16px; right:16px; z-index:100; display:grid; gap:8px; }
  .toast { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--primary); border-radius:8px; padding:10px 14px; box-shadow:0 6px 20px rgba(0,0,0,.18); max-width:340px; }
  .toast.ok { border-left-color:var(--ok); } .toast.bad { border-left-color:var(--bad); }

  @media (max-width: 760px) {
    .sider { position:fixed; z-index:30; left:0; top:0; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 30px rgba(0,0,0,.3); }
    body.nav-open .sider { transform:none; }
    body.nav-open .mask { display:block; position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.4); }
    .btn.menu-btn { display:inline-flex; }
    .content { padding:12px; } .topbar { padding:0 12px; }
    table, tbody, tr, td { display:block; }
    thead { display:none; }
    tr { padding:12px 14px; border-top:1px solid var(--line); }
    tr:first-child { border-top:0; }
    td { border:0; padding:5px 0; display:flex; gap:12px; justify-content:space-between; align-items:center; }
    td::before { content:attr(data-label); color:var(--muted); flex:none; }
    td.name-cell { display:block; } td.name-cell::before { display:none; }
    .desc { max-width:none; }
    dialog.drawer { width:100vw; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sider" id="sider">
    <div class="brand"><i></i>cf-cron-panel</div>
    <nav id="nav">
      <a href="#/tasks" data-route="tasks"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>定时任务</a>
      <a href="#/credentials" data-route="credentials"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg>凭据状态</a>
    </nav>
    <div class="sider-foot">
      <button id="themeBtn" title="切换主题"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span id="themeText">主题：自动</span></button>
      <button id="logout" hidden><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>退出登录</button>
    </div>
  </aside>
  <div class="mask" id="mask"></div>
  <div class="main">
    <header class="topbar">
      <button class="btn icon menu-btn" id="menuBtn" aria-label="菜单"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 id="pageTitle"></h1>
      <span class="spacer"></span>
      <span class="muted small">北京时间</span>
      <button class="btn" id="refresh"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>刷新</button>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<dialog id="cronDlg"><form method="dialog" class="dlg" id="cronForm">
  <div class="dlg-h" id="cronTitle"></div>
  <div class="dlg-b">
    <label class="muted small" for="cronInput">定时规则（5 段：分 时 日 月 周，北京时间）</label>
    <input type="text" id="cronInput" spellcheck="false" autocomplete="off">
    <div class="small" id="cronHint"></div>
    <div class="muted small" id="cronDefault"></div>
  </div>
  <div class="dlg-f">
    <button type="button" class="btn" id="cronReset">恢复默认</button>
    <button type="button" class="btn" id="cronCancel">取消</button>
    <button type="submit" class="btn primary" id="cronSave">保存</button>
  </div>
</form></dialog>

<dialog id="logDlg" class="drawer"><div class="dlg">
  <div class="dlg-h"><span id="logTitle"></span><span class="spacer"></span><button class="btn icon" id="logClose" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="dlg-b" id="logBody"></div>
</div></dialog>

<dialog id="confirmDlg"><div class="dlg">
  <div class="dlg-h" id="confirmTitle"></div>
  <div class="dlg-b" id="confirmMsg"></div>
  <div class="dlg-f"><button class="btn" id="confirmNo">取消</button><button class="btn primary" id="confirmYes">确定</button></div>
</div></dialog>
<div id="toasts"></div>

<script>
const HEADERS = { "Content-Type": "application/json", "X-Requested-With": "dashboard" };
const $ = (id) => document.getElementById(id);
const state = { tasks: [], status: [], kvBound: true, kvError: "", busy: new Set(), route: "tasks" };

/* ---------- 工具 ---------- */
const timeFmt = new Intl.DateTimeFormat("zh-CN", { timeZone: "Asia/Shanghai", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
const fmtTime = (ms) => (ms ? timeFmt.format(new Date(ms)).replace(/\//g, "-") : "—");

function el(tag, props = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k === "dataset") Object.assign(n.dataset, v);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== false) n.append(c);
  return n;
}
const svg = (inner, cls = "") => { const t = document.createElement("template"); t.innerHTML = `<svg viewBox="0 0 24 24" class="${cls}">${inner}</svg>`; return t.content.firstChild; };
const tag = (text, cls = "", icon) => el("span", { class: "tag " + cls }, icon || null, text);

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: HEADERS, body: body ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await res.json(); } catch {}
  if (res.status === 401) { location.href = "/login"; throw new Error("未登录"); }
  if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
  return data;
}

function toast(text, kind = "") {
  const t = el("div", { class: "toast " + kind }, text);
  $("toasts").append(t);
  setTimeout(() => t.remove(), 3800);
}

function confirmDialog(title, message) {
  return new Promise((resolve) => {
    $("confirmTitle").textContent = title;
    $("confirmMsg").textContent = message;
    const dlg = $("confirmDlg");
    const done = (v) => { dlg.close(); $("confirmYes").onclick = $("confirmNo").onclick = null; resolve(v); };
    $("confirmYes").onclick = () => done(true);
    $("confirmNo").onclick = () => done(false);
    dlg.addEventListener("cancel", () => resolve(false), { once: true });
    dlg.showModal();
  });
}

/* ---------- 结果状态展示 ---------- */
const FLAG_LABEL = {
  SUCCESS: ["成功", "ok"], ALREADY_TODAY: ["已完成", "ok"], RATE_LIMITED: ["被限频", "warn"],
  NO_CREDENTIAL: ["未配置凭据", "warn"], AUTH_EXPIRED: ["鉴权失败", "bad"], TOKEN_EXPIRED: ["鉴权失败", "bad"],
  NET_ERR: ["网络异常", "bad"], HTTP_ERR: ["网络异常", "bad"],
};
const flagTag = (flag) => { const [t, c] = FLAG_LABEL[flag] || ["失败", "bad"]; const n = tag(t, c); n.title = flag; return n; };
const TRIGGER = { cron: "定时触发", manual: "手动触发" };

function statusTag(t) {
  if (state.busy.has(t.id)) return tag("运行中", "run", svg('<path d="M21 12a9 9 0 1 1-6.2-8.6"/>', "spin"));
  if (!t.enabled) return tag("已禁用", "bad");
  return tag("空闲中");
}

/* ---------- 页面：定时任务 ---------- */
function renderTasks() {
  const nodes = [];
  if (!state.kvBound) nodes.push(el("div", { class: "banner" }, "未绑定 KV（CHECKIN_STATE）：无法保存 cron、启用状态和运行结果，任务按默认 cron 运行。"));
  if (state.kvError) nodes.push(el("div", { class: "banner" }, `读取 KV 失败：${state.kvError}`));
  const missing = state.status.filter((s) => !s.configured && !s.optional);
  if (missing.length) {
    nodes.push(el("div", { class: "banner" }, `有 ${missing.length} 项必要凭据未配置（${missing.map((s) => s.label).join("、")}），`,
      el("a", { href: "#/credentials" }, "查看详情")));
  }

  const rows = state.tasks.map((t) => {
    const last = t.lastRun;
    const busy = state.busy.has(t.id);
    const closeMore = (e) => e.target.closest("details").removeAttribute("open");
    return el("tr", {},
      el("td", { class: "name-cell", dataset: { label: "名称" } }, el("div", { class: "name" }, t.name), el("div", { class: "desc" }, t.description)),
      el("td", { dataset: { label: "状态" } }, statusTag(t)),
      el("td", { dataset: { label: "定时规则" } }, el("div", { class: "cron-cell" },
        el("code", { title: `默认：${t.defaultCron}` }, t.cron),
        el("button", { class: "link", title: "编辑定时规则", onclick: () => openCron(t) }, svg('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>')),
      )),
      el("td", { dataset: { label: "最近结果" } }, last ? flagTag(last.flag) : tag("暂无记录")),
      el("td", { dataset: { label: "最后运行时间" } }, last ? el("span", {}, fmtTime(last.startedAt), el("span", { class: "muted small" }, ` · ${TRIGGER[last.trigger] || ""}`)) : "—"),
      el("td", { dataset: { label: "下次运行时间" } }, t.enabled ? fmtTime(t.nextRunAt) : "—"),
      el("td", { dataset: { label: "操作" } }, el("div", { class: "actions" },
        el("button", { class: "link", disabled: busy, onclick: () => runTask(t, false) }, "运行"),
        el("button", { class: "link", onclick: () => showLog(t, t.lastRun) }, "日志"),
        el("details", { class: "more" }, el("summary", {}, "更多 ▾"),
          el("div", { class: "pop" },
            el("button", { onclick: (e) => { closeMore(e); toggleTask(t); }, disabled: !state.kvBound }, t.enabled ? "禁用" : "启用"),
            t.supportsDry ? el("button", { disabled: busy, onclick: (e) => { closeMore(e); runTask(t, true); } }, "试运行（不推送）") : null,
          )),
      )),
    );
  });

  nodes.push(el("div", { class: "card" }, el("table", {},
    el("thead", {}, el("tr", {}, ["名称", "状态", "定时规则", "最近结果", "最后运行时间", "下次运行时间", "操作"].map((h) => el("th", {}, h)))),
    el("tbody", {}, rows),
  )));
  $("content").replaceChildren(...nodes);
}

/* ---------- 页面：凭据状态 ---------- */
function renderCredentials() {
  const rows = state.status.map((s) => el("tr", {},
    el("td", { class: "name-cell", dataset: { label: "项目" } }, el("div", { class: "name" }, s.label), el("div", { class: "desc" }, `用于：${s.usedBy}`)),
    el("td", { dataset: { label: "状态" } }, s.configured ? tag("已配置", "ok") : tag(s.optional ? "未配置（可选）" : "未配置", s.optional ? "" : "warn")),
    el("td", { dataset: { label: "变量" } }, el("div", {}, s.vars.map((v) => el("div", {}, el("code", {}, v))))),
    el("td", { dataset: { label: "未配置时" } }, s.configured ? "—" : s.whenMissing),
  ));
  $("content").replaceChildren(
    el("div", { class: "muted" }, "这里只显示是否已配置，不显示任何内容。变量在 Cloudflare 控制台（Variables and Secrets）或用 scripts/export-env.mjs --push 设置。"),
    el("div", { class: "card" }, el("table", {},
      el("thead", {}, el("tr", {}, ["项目", "状态", "对应变量", "未配置时"].map((h) => el("th", {}, h)))),
      el("tbody", {}, rows),
    )),
  );
}

/* ---------- 动作 ---------- */
function showLog(t, rec, { dry = false } = {}) {
  $("logTitle").replaceChildren(`${t.name} · ${dry ? "试运行结果" : "最近一次结果"}`);
  const body = [];
  if (!rec) {
    body.push(el("div", { class: "muted" }, "暂无运行记录。"));
  } else {
    if (dry) body.push(el("div", { class: "banner" }, "试运行结果，不会保存，也没有写去重集合或推送。"));
    body.push(el("dl", { class: "kv" },
      el("dt", {}, "结果"), el("dd", {}, flagTag(rec.flag), ` `, el("span", { class: "muted small" }, rec.flag)),
      el("dt", {}, "开始时间"), el("dd", {}, fmtTime(rec.startedAt)),
      el("dt", {}, "触发方式"), el("dd", {}, TRIGGER[rec.trigger] || rec.trigger),
    ), el("pre", {}, rec.content || "(空)"));
  }
  $("logBody").replaceChildren(...body);
  $("logDlg").showModal();
}

async function runTask(t, dry) {
  const ok = await confirmDialog(dry ? `试运行「${t.name}」` : `运行「${t.name}」`,
    dry ? "试运行不会写去重集合，也不会推送，结果只显示一次。" : "将立即执行一次，会产生真实的签到 / 推送，并覆盖「最近一次结果」。");
  if (!ok) return;
  state.busy.add(t.id); render();
  try {
    const r = await api("POST", `/api/tasks/${t.id}/run`, { dry });
    if (r.dry) showLog(t, r.record, { dry: true });
    else toast(`「${t.name}」运行完成：${(FLAG_LABEL[r.record.flag] || ["失败"])[0]}`, r.record.flag === "SUCCESS" || r.record.flag === "ALREADY_TODAY" ? "ok" : "bad");
  } catch (e) { toast(`运行失败：${e.message}`, "bad"); }
  state.busy.delete(t.id);
  await load();
}

async function toggleTask(t) {
  try { await api("PUT", `/api/tasks/${t.id}`, { enabled: !t.enabled }); toast(`已${t.enabled ? "禁用" : "启用"}「${t.name}」`, "ok"); await load(); }
  catch (e) { toast(e.message, "bad"); }
}

let cronTask = null, cronTimer;
function openCron(t) {
  cronTask = t;
  $("cronTitle").textContent = `编辑定时规则 · ${t.name}`;
  $("cronInput").value = t.cron;
  $("cronDefault").textContent = `默认：${t.defaultCron}`;
  previewCron();
  $("cronDlg").showModal();
  $("cronInput").select();
}
function previewCron() {
  clearTimeout(cronTimer);
  cronTimer = setTimeout(async () => {
    const hint = $("cronHint");
    try {
      const r = await api("GET", "/api/cron/preview?expr=" + encodeURIComponent($("cronInput").value));
      hint.style.color = r.ok ? "var(--muted)" : "var(--bad)";
      hint.textContent = r.ok ? "接下来运行：" + r.next.map(fmtTime).join("　") : r.error;
      $("cronSave").disabled = !r.ok;
    } catch (e) { hint.style.color = "var(--bad)"; hint.textContent = e.message; }
  }, 250);
}
$("cronInput").addEventListener("input", previewCron);
$("cronReset").onclick = () => { $("cronInput").value = cronTask.defaultCron; previewCron(); };
$("cronCancel").onclick = () => $("cronDlg").close();
$("cronForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await api("PUT", `/api/tasks/${cronTask.id}`, { cron: $("cronInput").value });
    $("cronDlg").close();
    toast("定时规则已保存（其他节点最长约 1 分钟后生效）", "ok");
    await load();
  } catch (err) { $("cronHint").style.color = "var(--bad)"; $("cronHint").textContent = err.message; }
});
$("logClose").onclick = () => $("logDlg").close();
$("logDlg").addEventListener("click", (e) => { if (e.target === $("logDlg")) $("logDlg").close(); });

/* ---------- 路由 / 主题 / 数据 ---------- */
const PAGES = { tasks: ["定时任务", renderTasks], credentials: ["凭据状态", renderCredentials] };
function render() {
  const [title, fn] = PAGES[state.route];
  $("pageTitle").textContent = title;
  document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.route === state.route));
  fn();
}
function onRoute() {
  const r = location.hash.replace(/^#\//, "");
  state.route = PAGES[r] ? r : "tasks";
  document.body.classList.remove("nav-open");
  render();
}
window.addEventListener("hashchange", onRoute);
$("menuBtn").onclick = () => document.body.classList.toggle("nav-open");
$("mask").onclick = () => document.body.classList.remove("nav-open");
document.addEventListener("click", (e) => {
  document.querySelectorAll("details.more[open]").forEach((d) => { if (!d.contains(e.target)) d.removeAttribute("open"); });
});
$("refresh").onclick = async () => { await load(); toast("已刷新", "ok"); };

const THEMES = ["auto", "light", "dark"], THEME_TEXT = { auto: "自动", light: "浅色", dark: "深色" };
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  $("themeText").textContent = `主题：${THEME_TEXT[t]}`;
}
let theme = localStorage.getItem("theme") || "auto";
applyTheme(theme);
$("themeBtn").onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; localStorage.setItem("theme", theme); applyTheme(theme); };

$("logout").onclick = async () => { try { await api("POST", "/api/logout"); } catch {} location.href = "/login"; };
api("GET", "/api/session").then((s) => { $("logout").hidden = !s.required; }).catch(() => {});

async function load() {
  try {
    const [tasks, status] = await Promise.all([api("GET", "/api/tasks"), api("GET", "/api/status")]);
    Object.assign(state, { tasks: tasks.tasks, kvBound: tasks.kvBound, kvError: tasks.kvError, status: status.items });
  } catch (e) {
    if (e.message !== "未登录") $("content").replaceChildren(el("div", { class: "banner" }, `加载失败：${e.message}`));
    return;
  }
  render();
}

onRoute();
load();
</script>
</body>
</html>
